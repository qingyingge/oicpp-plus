name: Build .dmg to test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare clangd bundle
        run: pnpm run prebuild:clangd
      - name: Prepare clang-format bundle
        run: pnpm run prebuild:clang-format
      - name: Build optional native helper
        run: pnpm run prebuild:native

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run prebuild:buildinfo
          pnpm run prebuild:icons
          test -f build/icons/png/512x512.png
          pnpm exec electron-builder --mac dmg

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-test-artifacts
          path: dist/*.dmg
          if-no-files-found: error
