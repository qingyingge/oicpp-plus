name: Build and Release

on:
  push:
    tags:
      # 只构建 fork 自己的发布标签：形如 v1.6.0-beta1-plus.1（必须以 -plus.<后缀> 结尾）。
      # 上游的 v1.6.0 / v1.6.0-beta1 这类纯上游版本号不再触发本仓库打包与 Release。
      - "v*-plus.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g., v1.6.0-beta1-plus.1)"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node -e "try { require('sharp'); console.log('sharp ok'); } catch (e) { console.log('sharp unavailable, icon generation will fail (build/icons/png has been removed)'); }"

      - name: Prepare clangd bundle
        run: pnpm run prebuild:clangd
      - name: Prepare clang-format bundle
        run: pnpm run prebuild:clang-format
      - name: Build optional native helper
        run: pnpm run prebuild:native

      - name: Verify node-pty linux binary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = path.dirname(require.resolve('node-pty/package.json'));
          const candidates = [
            path.join(pkg, 'prebuilds', `linux-${process.arch}`, 'pty.node'),
            path.join(pkg, 'build', 'Release', 'pty.node'),
            path.join(pkg, 'build', 'Debug', 'pty.node')
          ];
          console.log('node-pty path:', pkg);
          console.log('check candidates:', candidates);
          if (!candidates.some((file) => fs.existsSync(file))) {
            throw new Error('node-pty linux native binary missing; terminal will be unavailable in Linux package.');
          }
          NODE

      - name: Install AppImage dependencies
        if: github.repository != 'mywwzh/oicpp-dev'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      # electron 44 起 npm 包不再有 postinstall（下载脚本改成 bin: install-electron），
      # 所以 pnpm install 之后 node_modules/electron/dist 是空的，electron-builder 会报
      # "The specified electronDist does not exist"。三个平台的打包步骤前都要先取一次二进制。
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.repository }}" = "mywwzh/oicpp-dev" ]; then
            pnpm run build -- --linux deb
          else
            pnpm run build
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

      - name: Upload Linux packages to remote
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'qingyingge/oicpp-plus'
        env:
          UPLOAD_API: ${{ secrets.UPLOAD_API }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          if [ -z "$UPLOAD_API" ]; then echo "UPLOAD_API 未配置，跳过远端上传"; exit 0; fi
          VERSION=$VERSION
          VERSION=${VERSION#v}
          echo "Uploading packages for version $VERSION to $UPLOAD_API"
          mapfile -t FILES < <(ls dist/*.deb dist/*.rpm dist/*.AppImage 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No Linux packages built, aborting upload" >&2
            exit 1
          fi
          for f in "${FILES[@]}"; do
            echo "Uploading $f"
            curl -fsS -X POST -H "Authorization: Bearer $UPLOAD_TOKEN" -F "file=@$f" -F "version=$VERSION" -F "platform=linux" "$UPLOAD_API"
          done

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node -e "try { require('sharp'); console.log('sharp ok'); } catch (e) { console.log('sharp unavailable, icon generation will fail (build/icons/png has been removed)'); }"

      - name: Prepare clangd bundle
        run: pnpm run prebuild:clangd
      - name: Prepare clang-format bundle
        run: pnpm run prebuild:clang-format
      - name: Build optional native helper
        run: pnpm run prebuild:native

      - name: Ensure dmg-license is installed
        # pnpm 12 的 pnpm add 没有 --no-save（npm 写法，直接 unexpected argument 退出）。
        # 用 -D：实测 --dev 会被塞进 dependencies（只有 -D 才进 devDependencies），
        # 两者都会装进 node_modules —— 这里要的只是 electron-builder 能找到它。
        # package.json 只在那次一次性 checkout 里被改，不回填仓库。
        run: pnpm add -D dmg-license

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run prebuild:buildinfo
          pnpm run prebuild:icons
          test -f build/icons/png/512x512.png
          pnpm exec electron-builder --mac dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload macOS package to remote
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'qingyingge/oicpp-plus'
        env:
          UPLOAD_API: ${{ secrets.UPLOAD_API }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          if [ -z "$UPLOAD_API" ]; then echo "UPLOAD_API 未配置，跳过远端上传"; exit 0; fi
          VERSION=$VERSION
          VERSION=${VERSION#v}
          echo "Uploading packages for version $VERSION to $UPLOAD_API"
          mapfile -t FILES < <(ls dist/*.dmg 2>/dev/null)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No macOS packages built, aborting upload" >&2
            exit 1
          fi
          for f in "${FILES[@]}"; do
            echo "Uploading $f"
            curl -fsS -X POST -H "Authorization: Bearer $UPLOAD_TOKEN" -F "file=@$f" -F "version=$VERSION" -F "platform=macos" "$UPLOAD_API"
          done

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = "${{ github.event.inputs.tag }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.Substring(1)
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NSIS"
          }
          # Verify makensis is accessible
          $nsisPath = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsisPath) {
            Write-Warning "makensis not found on PATH, trying explicit lookup"
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) {
              Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $found -Parent)
              Write-Host "Added NSIS path: $(Split-Path $found -Parent)"
            } else {
              Write-Error "NSIS installation failed - makensis.exe not found"
            }
          } else {
            Write-Host "makensis found at: $nsisPath"
          }

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node -e "try { require('sharp'); console.log('sharp ok'); } catch (e) { console.log('sharp unavailable, icon generation will fail (build/icons/png has been removed)'); }"

      - name: Prepare clangd bundle
        run: pnpm run prebuild:clangd
      - name: Prepare clang-format bundle
        run: pnpm run prebuild:clang-format
      - name: Build optional native helper
        run: pnpm run prebuild:native

      - name: Verify node-pty windows binary
        shell: powershell
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const pkg = path.dirname(require.resolve("node-pty/package.json"));
          const platformDir = `win32-${process.arch}`;
          const candidates = [
            path.join(pkg, "prebuilds", platformDir, "pty.node"),
            path.join(pkg, "build", "Release", "pty.node"),
            path.join(pkg, "build", "Debug", "pty.node")
          ];
          console.log("node-pty path:", pkg);
          console.log("check candidates:", candidates);
          if (!fs.existsSync(path.join(pkg, "lib", "index.js"))) {
            throw new Error("node-pty lib/index.js missing; terminal will be unavailable in Windows package.");
          }
          if (!candidates.some((file) => fs.existsSync(file))) {
            throw new Error("node-pty windows native binary missing; terminal will be unavailable in Windows package.");
          }
          '@ | node

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Build Windows app for NSIS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm run prebuild:buildinfo
          pnpm run prebuild:icons
          pnpm run prebuild:native
          pnpm run prebuild:clangd
          pnpm run prebuild:clang-format
          pnpm exec electron-builder --win dir

      - name: Verify packaged node-pty in app.asar.unpacked
        shell: powershell
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const root = path.join(process.cwd(), "dist", "win-unpacked", "resources", "app.asar.unpacked", "node_modules", "node-pty");
          const platformDir = `win32-${process.arch}`;
          const indexFile = path.join(root, "lib", "index.js");
          const nativeCandidates = [
            path.join(root, "prebuilds", platformDir, "pty.node"),
            path.join(root, "build", "Release", "pty.node"),
            path.join(root, "build", "Debug", "pty.node")
          ];
          const sidecarCandidates = [
            path.join(root, "prebuilds", platformDir, "winpty-agent.exe"),
            path.join(root, "prebuilds", platformDir, "conpty", "OpenConsole.exe")
          ];
          console.log("packaged node-pty root:", root);
          if (!fs.existsSync(indexFile)) {
            throw new Error("packaged node-pty lib/index.js missing in app.asar.unpacked. Ensure asarUnpack includes node_modules/node-pty/**/*.");
          }
          if (!nativeCandidates.some((file) => fs.existsSync(file))) {
            throw new Error("packaged node-pty native binary missing in app.asar.unpacked.");
          }
          if (!sidecarCandidates.some((file) => fs.existsSync(file))) {
            throw new Error("packaged node-pty runtime sidecar missing in app.asar.unpacked.");
          }
          '@ | node

      - name: Prepare and Build Installer
        shell: powershell
        run: |
          $version = $env:VERSION
          Write-Host "Building version: $version"
          makensis "/DPRODUCT_VERSION=$version" installer.nsi

      # 便携包用的是同一份 win-unpacked，只多一个 portable.txt 标记。
      # 学校机房和家里机经常没有管理员权限，免安装那一份才是这些机器上唯一能用的形态。
      - name: Build portable package
        run: pnpm run package:portable

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/OICPP-*-Setup.exe
            dist/OICPP-*-Portable-*.zip
          if-no-files-found: error

      - name: Upload Windows installer to remote
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'qingyingge/oicpp-plus'
        env:
          UPLOAD_API: ${{ secrets.UPLOAD_API }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        shell: bash
        run: |
          if [ -z "$UPLOAD_API" ]; then echo "UPLOAD_API 未配置，跳过远端上传"; exit 0; fi
          VERSION=$VERSION
          echo "Looking for installer for version: $VERSION"
          FILE=$(ls dist/OICPP-*-Setup.exe 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then echo "No installer found, aborting upload" >&2; exit 1; fi
          echo "Uploading $FILE to $UPLOAD_API"
          curl -fsS -X POST -H "Authorization: Bearer $UPLOAD_TOKEN" -F "file=@$FILE" -F "version=$VERSION" -F "platform=windows" "$UPLOAD_API"

  release:
    # 首版只发 exe + deb：macOS 不在交付范围内，不能让它阻塞 Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
